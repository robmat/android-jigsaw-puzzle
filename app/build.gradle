plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.batodev.releasetools'
    id 'io.gitlab.arturbosch.detekt'
}

// Shared secrets (dev_keystore.jks etc.) live one folder up, distinct from
// the project-local keystore.properties used by prodSigned below.
def sharedKeystorePropertiesFile = rootProject.file("../keystore.properties")
def sharedKeystoreProperties = new Properties()
if (sharedKeystorePropertiesFile.exists()) {
    sharedKeystoreProperties.load(new FileInputStream(sharedKeystorePropertiesFile))
}

def versionProps = new Properties()
file("version.properties").withInputStream { versionProps.load(it) }

android {
    defaultConfig {
        applicationId "com.batodev.jigsawpuzzle"
        minSdkVersion 24
        compileSdk = 37
        targetSdkVersion 37
        versionCode versionProps.getProperty("versionCode").toInteger()
        versionName versionProps.getProperty("versionName")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        prodSigned {
            // This configuration will be populated by the logic below
            // based on whether the keystore.properties file is found
            // and whether a debugProdSigned variant is being built.
        }
        release {
            if (sharedKeystorePropertiesFile.exists()) {
                storeFile rootProject.file(sharedKeystoreProperties['storeFile'])
                storePassword sharedKeystoreProperties['storePassword']
                keyAlias sharedKeystoreProperties['keyAlias']
                keyPassword sharedKeystoreProperties['keyPassword']
            }
        }
    }

    // Conditionally load keystore properties or set N/A for prodSigned
    // when a task related to debugProdSigned is being built.
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    if (keystorePropertiesFile.exists()) {
        def keystoreProperties = new Properties()
        new FileInputStream(keystorePropertiesFile).withCloseable { fis ->
            keystoreProperties.load(fis)
        }
        android.signingConfigs.prodSigned {
            storeFile file(keystoreProperties.getProperty('storeFile'))
            storePassword keystoreProperties.getProperty('storePassword')
            keyAlias keystoreProperties.getProperty('keyAlias')
            keyPassword keystoreProperties.getProperty('keyPassword')
        }
    } else {
        logger.warn("Warning: keystore.properties not found. Do not build the 'debugProdSigned' variant.")
        android.signingConfigs.prodSigned {
            storeFile rootProject.file("N/A")
            storePassword "N/A"
            keyAlias "N/A"
            keyPassword "N/A"
        }
    }

    // androidTest sources attach only to the variant named here, so keep the default on debug:
    // that is what Android Studio selects, what marks app/src/androidTest as a test source root,
    // and what keeps local test runs fast (no R8 pass per run).
    // Run with -PminifiedTests to point the suite at releaseTest instead - the same R8 output as
    // release, which is what catches release-only breakage (see proguard-rules-test.pro).
    testBuildType = project.hasProperty('minifiedTests') ? 'releaseTest' : 'debug'
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debugProdSigned {
            signingConfig signingConfigs.prodSigned
        }

        // Same R8 pipeline and signing as release, plus keeps that only the instrumentation
        // harness needs - so the release APK users get stays fully shrunk and obfuscated.
        releaseTest {
            initWith release
            matchingFallbacks = ['release']
            proguardFile 'proguard-rules-test.pro'
        }
    }
    namespace 'com.batodev.jigsawpuzzle'

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.exifinterface
    implementation libs.chrisbanes.photoview
    implementation libs.play.services.ads
    // play-services-ads transitively pins the ancient androidx.work:work-runtime:2.7.0 -
    // override it so WorkManager's own WorkDatabase creation doesn't crash on real
    // devices (see sgtpuzzles' fix for the full incident writeup).
    implementation libs.androidx.work.runtime
    implementation libs.androidx.multidex
    implementation libs.bumptech.glide
    implementation libs.caverock.androidsvg.aar
    implementation libs.google.play.review.ktx
    implementation libs.otaliastudios.zoomlayout
    implementation libs.google.code.gson
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    ksp libs.bumptech.glide.ksp
    implementation(libs.smehranb.glowbutton)
    implementation libs.play.services.games.v2

    // Something in the release graph drags in concurrent-futures-ktx 1.1.0, which predates
    // SuspendToFutureAdapter. androidx.test:core needs 1.2.0, but consistent resolution pins
    // androidTest to whatever release resolved - so R8 fails the androidTest minify with
    // "Missing class androidx.concurrent.futures.SuspendToFutureAdapter". Declaring it lifts both.
    releaseTestImplementation libs.androidx.concurrent.futures.ktx
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testImplementation libs.junit.jupiter.params
    testRuntimeOnly libs.junit.platform.launcher

    testImplementation libs.hamcrest
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.intents
}
